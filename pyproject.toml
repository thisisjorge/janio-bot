[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "janio-bot"
version = "0.1.0"
description = "Bot Discord em Python com previsões comunitárias e integrações opcionais de LoL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Janio Bot contributors" }]
dependencies = [
  "aiosqlite==0.22.1",
  "deno==2.9.3",
  "discord.py[voice]==2.7.1",
  "httpx==0.28.1",
  "wavelink>=3.4.1",
  "pylast==5.3.0",
  "python-dotenv==1.1.1",
  "google-api-python-client==2.118.0",
  "google-auth==2.28.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
janio-bot = "janio_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/janio_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["janio_bot"]
